output:
  - summary
  - meta
pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,ts,jsx,tsx,mjs,mts,cjs,cts}"
      run: pnpm --silent lint {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "*.{js,ts,jsx,tsx,mjs,mts,cjs,cts,json,yml,yaml,md}"
      run: pnpm --silent format {staged_files}
      stage_fixed: true
    typescript-build:
      glob: "*.{js,ts,jsx,tsx,mjs,mts,cjs,cts}"
      run: pnpm --silent build
